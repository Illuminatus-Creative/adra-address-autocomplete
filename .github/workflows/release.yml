name: Release

# Pushing a tag like v1.2.0 publishes a GitHub release with the plugin zip. Sites running the
# plugin find it through the update checker and offer it on the Plugins screen.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    name: Publish release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Every client site installs what's released, so only release code that's on main.
      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME isn't on main. Merge first, then tag a commit on main."
            exit 1
          fi
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails unless the tag matches the plugin's version.
      - run: bin/build-zip.sh "$GITHUB_REF_NAME"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A release made on GitHub's website creates the tag, which starts this workflow; the
          # release then already exists, so attach the zip to it.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/adra-address-autocomplete.zip --clobber
            exit 0
          fi

          flags=(--verify-tag --title "$TAG" --generate-notes)
          # A tag like v1.2.0-rc.1 is a pre-release; the update checker ignores those.
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" dist/adra-address-autocomplete.zip "${flags[@]}"
